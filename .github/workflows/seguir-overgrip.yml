name: Seguir OverGrip

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overgrip
  cancel-in-progress: false

jobs:
  seguir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Leer torneos activos
        id: lista
        run: echo "torneos=$(grep -v '^#' overgrip/torneos.txt | xargs)" >> "$GITHUB_OUTPUT"
      - name: Bajar resultados
        if: steps.lista.outputs.torneos != ''
        run: python3 overgrip/seguir.py ${{ steps.lista.outputs.torneos }}
      - name: Guardar cambios
        run: |
          git add overgrip/datos
          if git diff --cached --quiet; then echo "Sin novedades"; exit 0; fi
          git config user.name "surpadel-bot"
          git config user.email "sur.padel.store@gmail.com"
          git commit -m "OverGrip: resultados nuevos [skip ci]"
          git push
