name: Actualizar catálogo

on:
  schedule:
    - cron: "0 10 * * *"   # todos los días a las 7:00 de Argentina
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar librerías para las fotos
        run: pip install pillow numpy scipy
      - name: Armar la web
        env:
          SUPPLIER_URL: ${{ secrets.SUPPLIER_URL }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
